[msa_vm]
msa-vm ansible_host=192.168.237.134

[msa_vm:vars]
ansible_user=ubuntu
# Jenkins 컨테이너 안에 생성한 키 (jenkins_home 볼륨에 저장됨, git에는 포함되지 않는다)
ansible_ssh_private_key_file=/var/jenkins_home/.ssh/id_ed25519_msa
ansible_python_interpreter=/usr/bin/python3
# 처음 접속하는 호스트 키만 자동 등록하고, 이후 키가 바뀌면 접속을 거부한다
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
